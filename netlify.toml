# Netlify configuration — Retail portfolio
#
# This site serves three views from one repo:
#   - Apex / portfolio domain: shows the landing page (index.html) with tiles
#     linking to each property dashboard.
#   - 68-100.<your-domain>:    serves /68-100/index.html as the root of the host
#   - commack.<your-domain>:   serves /commack/index.html as the root of the host
#
# Set up two custom subdomains in Netlify (Site settings → Domain management
# → Add domain alias) pointing the same site at:
#     - 68-100.<your-domain>.com
#     - commack.<your-domain>.com
# The redirect rules below detect the host and rewrite the path accordingly.

[build]
  publish = "."

# 68-100 Old Riverhead Rd subdomain → serve the 68-100 dashboard at the root
[[redirects]]
  from = "/*"
  to = "/68-100/:splat"
  status = 200
  force = true
  conditions = {Host = ["68-100.hreaportfolio.com", "68-100.netlify.app", "riverhead.hreaportfolio.com"]}

# Commack subdomain → serve the Commack dashboard at the root
[[redirects]]
  from = "/*"
  to = "/commack/:splat"
  status = 200
  force = true
  conditions = {Host = ["commack.hreaportfolio.com", "commack.netlify.app"]}

# Patchogue subdomain → serve the 350 E Main St Patchogue dashboard at the root
[[redirects]]
  from = "/*"
  to = "/patchogue/:splat"
  status = 200
  force = true
  conditions = {Host = ["patchogue.hreaportfolio.com", "patchogue.netlify.app"]}

# 476 Montauk Highway (East Hampton) subdomain → serve the 476-montauk dashboard
[[redirects]]
  from = "/*"
  to = "/476-montauk/:splat"
  status = 200
  force = true
  conditions = {Host = ["476-montauk.hreaportfolio.com", "476-montauk.netlify.app", "easthampton.hreaportfolio.com"]}

# Amagansett (136 Main + 11 Indian Wells) subdomain → serve the amagansett dashboard
[[redirects]]
  from = "/*"
  to = "/amagansett/:splat"
  status = 200
  force = true
  conditions = {Host = ["amagansett.hreaportfolio.com", "amagansett.netlify.app"]}

# Friendly path-based routing (works on any domain) — these map common short URLs
[[redirects]]
  from = "/68-100"
  to = "/68-100/"
  status = 301

[[redirects]]
  from = "/commack"
  to = "/commack/"
  status = 301

[[redirects]]
  from = "/patchogue"
  to = "/patchogue/"
  status = 301

[[redirects]]
  from = "/476-montauk"
  to = "/476-montauk/"
  status = 301

[[redirects]]
  from = "/amagansett"
  to = "/amagansett/"
  status = 301

# Cache headers — the dashboards are large (~600 KB each) but mostly static JSON
# embedded in HTML; cache aggressively for snappy reloads.
[[headers]]
  for = "/68-100/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/commack/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/patchogue/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/476-montauk/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/amagansett/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
